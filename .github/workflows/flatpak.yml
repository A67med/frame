name: Flatpak

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "flatpak/**"
      - "src-tauri/tauri.flatpak.conf.json"
      - ".github/workflows/flatpak.yml"
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils ostree
      - name: Configure Flathub
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install pinned SDK
        run: >-
          flatpak install --user -y flathub
          org.gnome.Platform//49 org.gnome.Sdk//49
          org.freedesktop.Sdk.Extension.rust-stable//25.08
          org.freedesktop.Sdk.Extension.node22//25.08
      - name: Validate metadata
        run: |
          flatpak/update-flatpak.sh --check
          desktop-file-validate flatpak/io.github.abdallahkattriah_sketch.Frame.desktop
          appstreamcli validate --no-net flatpak/io.github.abdallahkattriah_sketch.Frame.metainfo.xml
          flatpak-builder --show-manifest flatpak/io.github.abdallahkattriah_sketch.Frame.yml >/dev/null
      - name: Build repository
        run: flatpak-builder --user --force-clean --state-dir=.flatpak-work/state --repo=.flatpak-work/repo .flatpak-work/build flatpak/io.github.abdallahkattriah_sketch.Frame.yml
      - name: Build single-file bundle
        run: flatpak build-bundle .flatpak-work/repo Frame.flatpak io.github.abdallahkattriah_sketch.Frame
      - name: Validate bundle
        run: |
          ostree init --repo=.flatpak-work/validation-repo --mode=archive-z2
          flatpak build-import-bundle --update-appstream --no-update-summary .flatpak-work/validation-repo Frame.flatpak
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: Frame-flatpak-x86_64
          path: Frame.flatpak
          retention-days: 14
          if-no-files-found: error
