name: Temporary Windows-only formatting
on:
  push:
    branches:
      - ci/windows-only-release-20261114
    paths:
      - ".github/workflows/format-windows-only.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/windows-only-release-20261114
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          version: 1.1.0
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile
      - name: Apply repository formatter to Windows-only changes
        run: |
          vp fmt .github/workflows/harbor-core.yml .github/workflows/release-packaging-smoke.yml scripts/release-assets.mjs tests/windows-release-manifest.test.mjs
          git diff --check
          echo "===== FORMATTED DIFF START ====="
          git diff -- .github/workflows/harbor-core.yml .github/workflows/release-packaging-smoke.yml scripts/release-assets.mjs tests/windows-release-manifest.test.mjs
          echo "===== FORMATTED DIFF END ====="
