name: Frame Core

on:
  push:
    paths:
      - "crates/frame-core/**"
      - ".github/workflows/frame-core.yml"
  pull_request:
    paths:
      - "crates/frame-core/**"
      - ".github/workflows/frame-core.yml"

permissions:
  contents: read

concurrency:
  group: frame-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: crates/frame-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/frame-core
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
