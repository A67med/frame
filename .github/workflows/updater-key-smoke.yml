name: Updater Key Smoke Test (temporary)

# Temporary branch-only verification. Not part of the published release.
on:
  push:
    branches:
      - fix/flatpak-and-updater-key-20261114
    paths:
      - ".github/workflows/updater-key-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-and-verify:
    name: Verify GitHub signing secret against Frame public key
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install project CLI and minisign verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          pnpm install --frozen-lockfile
      - name: Sign a tiny non-production test file
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Repository signing secret is not available."
            exit 1
          fi
          printf 'Frame signing smoke test - no executable or user data\n' > signing-test.txt
          node node_modules/@tauri-apps/cli/tauri.js signer sign -p "" signing-test.txt >/dev/null
          test -s signing-test.txt.sig
      - name: Verify signature with the checked-in public key
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          pubkey = json.loads(Path("src-tauri/tauri.conf.json").read_text())["plugins"]["updater"]["pubkey"]
          Path("signing-test.pub").write_bytes(base64.b64decode(pubkey, validate=True))
          signature = Path("signing-test.txt.sig").read_text().strip()
          Path("signing-test.minisig").write_bytes(base64.b64decode(signature, validate=True))
          PY
          minisign -Vm signing-test.txt -p signing-test.pub -x signing-test.minisig
          echo "Signing secret matches the configured Frame updater public key."
